<div class="p-6 max-w-2xl mx-auto">
  <h1 class="text-2xl font-semibold tracking-tight mb-6">My Diary</h1>

  @if (entries.length === 0) {
    <p class="text-[#9B96A3] text-sm">No entries yet — log a movie to get started.</p>
  }

  @for (entry of entries; track entry.id) {
    <div class="flex gap-4 items-start border-b border-[#2C2A33] py-4">
      @if (entry.posterPath) {
        <img [src]="imageBase + entry.posterPath" [alt]="entry.movieTitle" class="w-12 rounded-md flex-shrink-0" />
      }
      <div class="flex-1 min-w-0">
        <p class="font-medium text-[#F2F0EC]">{{ entry.movieTitle }}</p>
        <p class="text-sm text-[#9B96A3] mt-0.5">{{ entry.watchedDate }} &middot; <span class="text-[#D9A441]">{{ entry.rating }} ★</span></p>
        @if (entry.reviewText) {
          <p class="text-sm text-[#D6D3DA] mt-2">{{ entry.reviewText }}</p>
        }
      </div>
      <button (click)="delete(entry.id)" class="text-sm text-[#6E6A76] hover:text-[#C4675A] transition-colors">Delete</button>
    </div>
  }
</div>
