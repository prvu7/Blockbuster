<div class="p-6 max-w-2xl mx-auto">
  <h1 class="text-2xl font-semibold tracking-tight mb-6">My Watchlist</h1>

  @if (items.length === 0) {
    <p class="text-[#9B96A3] text-sm">Nothing saved yet — search for a movie to add one.</p>
  }

  @for (item of items; track item.id) {
    <div class="flex gap-4 items-center border-b border-[#2C2A33] py-4">
      @if (item.posterPath) {
        <img [src]="imageBase + item.posterPath" [alt]="item.movieTitle" class="w-12 rounded-md flex-shrink-0" />
      }
      <div class="flex-1 min-w-0">
        <p class="font-medium text-[#F2F0EC] truncate">{{ item.movieTitle }}</p>
      </div>
      <button (click)="logIt(item)" class="text-sm text-[#D9A441] hover:text-[#E6B860] transition-colors">Log it</button>
      <button (click)="remove(item.id)" class="text-sm text-[#6E6A76] hover:text-[#C4675A] transition-colors">Remove</button>
    </div>
  }
</div>
