<div class="p-6 max-w-4xl mx-auto">
  <div class="flex gap-2 mb-6">
    <input
      [(ngModel)]="query"
      (keyup.enter)="search()"
      placeholder="Search for a movie..."
      class="border px-4 py-2 rounded flex-1"
    />
    <button (click)="search()" class="bg-blue-600 text-white px-4 py-2 rounded">Search</button>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
    <a *ngFor="let movie of results" [routerLink]="['/movie', movie.id]" class="block">
    @if (movie.poster_path) {
        <img [src]="imageBase + movie.poster_path" [alt]="movie.title" class="rounded w-full" />
    }
      <p class="mt-1 text-sm font-medium">{{ movie.title }}</p>
      <p class="text-xs text-gray-500">{{ movie.release_date | slice:0:4 }}</p>
    </a>
  </div>
</div>
