spring.application.name=blockbuster

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/blockbuster_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

tmdb.api.key=${TMDB_API_KEY}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-2u3pl8nph6uw3zzd.us.auth0.com/
auth0.audience=https://blockbuster-api